# Overlay for the multi-node topology (inventory/lab.ini).
clusterName: lab
domain: lab.local
storageClass: longhorn
controlPlaneCount: 1
metalLbAddressPool: 192.168.0.240-192.168.0.250
# 1 control plane (192.168.0.201) + 2 workers (192.168.0.202/.203).
# To move to an HA control plane later, add two more control-plane hosts and
# point control_plane_endpoint at a kube-vip VIP.
