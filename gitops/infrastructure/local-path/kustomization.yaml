apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# local-path-provisioner is vendored (manifest.yaml) from the upstream release so
# the build does not depend on a remote URL. To upgrade, refresh manifest.yaml
# from:
#   https://github.com/rancher/local-path-provisioner/releases/tag/v0.0.37
#   deploy/local-path-storage.yaml
resources:
  - manifest.yaml
patches:
  - path: storageclass-default-patch.yaml
    target:
      kind: StorageClass
      name: local-path
