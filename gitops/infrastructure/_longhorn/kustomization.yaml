apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# PLACEHOLDER: excluded from the ApplicationSet. Rename this directory to
# `longhorn` to activate it. Review values.yaml first.
namespace: longhorn-system
helmCharts:
  - name: longhorn
    repo: https://charts.longhorn.io
    version: 1.12.1
    releaseName: longhorn
    namespace: longhorn-system
    valuesFile: values.yaml
