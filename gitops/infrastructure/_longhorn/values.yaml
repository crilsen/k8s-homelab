# Longhorn Helm values (placeholder — review before enabling).
# Sized for a small homelab. Requires >=3 nodes for the default replica count of
# 3; with fewer nodes set defaultReplicaCount accordingly.
defaultSettings:
  defaultReplicaCount: 3
  # Keep local-path as the only default StorageClass until you switch the overlay.
  createDefaultDiskLabeledNodes: false

persistence:
  defaultClass: false
  defaultClassReplicaCount: 3

tolerations:
  - key: node-role.kubernetes.io/control-plane
    effect: NoSchedule
    operator: Exists
