# ApplicationSets discover every directory under each layer and create one
# Application per component. Add a component by adding a directory; nothing to
# edit here. Replace crilsen with the real repository owner (see README).
---
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: infrastructure
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - git:
        repoURL: https://github.com/crilsen/k8s-homelab.git
        revision: HEAD
        directories:
          - path: gitops/infrastructure/*
          # Directories prefixed with "_" are placeholders, not reconciled.
          - path: gitops/infrastructure/_*
            exclude: true
  template:
    metadata:
      name: 'infra-{{ .path.basename }}'
      annotations:
        argocd.argoproj.io/sync-wave: "0"
    spec:
      project: default
      source:
        repoURL: https://github.com/crilsen/k8s-homelab.git
        targetRevision: HEAD
        path: '{{ .path.path }}'
        kustomize:
          # Let kustomize render the `helmCharts:` entries in each component.
          buildOptions: --enable-helm
      destination:
        server: https://kubernetes.default.svc
        namespace: infrastructure
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
---
