# Single-node topology: one control-plane that also schedules workloads.
# Replace addresses and connection details with your host.
#
#   ansible-playbook -i inventory/single-node.ini playbooks/prepare.yml
#   ansible-playbook -i inventory/single-node.ini playbooks/cluster-init.yml

[k8s_control_plane]
k8s-1 ansible_host=192.168.1.10

# No dedicated workers in this topology; the control-plane is untainted so
# workloads can schedule on it (single_node: true below).

[k8s_workers]

[k8s_cluster:children]
k8s_control_plane
k8s_workers

[all:vars]
ansible_user=ubuntu
ansible_ssh_private_key_file=~/.ssh/id_ed25519
single_node=true
