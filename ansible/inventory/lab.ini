# Multi-node topology: HA control plane (3 nodes, stacked etcd, kube-vip VIP)
# plus workers. Works with any number of workers; add/remove freely.
#
#   ansible-playbook -i inventory/lab.ini playbooks/prepare.yml
#   ansible-playbook -i inventory/lab.ini playbooks/cluster-init.yml
#   ansible-playbook -i inventory/lab.ini playbooks/join.yml

[k8s_control_plane]
k8s-cp-1 ansible_host=192.168.1.11
k8s-cp-2 ansible_host=192.168.1.12
k8s-cp-3 ansible_host=192.168.1.13

[k8s_workers]
k8s-w-1 ansible_host=192.168.1.21
k8s-w-2 ansible_host=192.168.1.22

[k8s_cluster:children]
k8s_control_plane
k8s_workers

[all:vars]
ansible_user=ubuntu
ansible_ssh_private_key_file=~/.ssh/id_ed25519
single_node=false
