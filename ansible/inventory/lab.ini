# Two-node topology: one control plane + one worker.
# Add more workers (or two more control planes for HA) by editing this file;
# no other change is needed.
#
#   ansible-playbook -i inventory/lab.ini playbooks/prepare.yml
#   ansible-playbook -i inventory/lab.ini playbooks/cluster-init.yml
#   ansible-playbook -i inventory/lab.ini playbooks/join.yml

[k8s_control_plane]
k8s-cp-1 ansible_host=192.168.0.201

[k8s_workers]
k8s-w-1 ansible_host=192.168.0.202
# k8s-w-2 ansible_host=192.168.0.203   # uncomment to add a third node later

[k8s_cluster:children]
k8s_control_plane
k8s_workers

[all:vars]
ansible_user=ubuntu
ansible_ssh_private_key_file=~/.ssh/id_ed25519
single_node=false
