---
- name: Check whether the control plane is already initialized
  ansible.builtin.stat:
    path: /etc/kubernetes/admin.conf
  register: kubeadm_admin_conf

- name: Render kubeadm init configuration
  ansible.builtin.template:
    src: kubeadm-init.yaml.j2
    dest: /etc/kubernetes/kubeadm-init.yaml
    mode: "0600"
  when: not kubeadm_admin_conf.stat.exists

- name: Initialize the cluster with kubeadm
  ansible.builtin.command:
    cmd: kubeadm init --config /etc/kubernetes/kubeadm-init.yaml --upload-certs
    creates: /etc/kubernetes/admin.conf

- name: Ensure .kube exists for the provisioning user
  ansible.builtin.file:
    path: "{{ ansible_env.HOME }}/.kube"
    state: directory
    mode: "0700"

- name: Install kubeconfig for the provisioning user
  ansible.builtin.copy:
    src: /etc/kubernetes/admin.conf
    dest: "{{ ansible_env.HOME }}/.kube/config"
    remote_src: true
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0600"

- name: Allow workloads to schedule on the control plane (single-node)
  ansible.builtin.command:
    cmd: kubectl --kubeconfig /etc/kubernetes/admin.conf taint nodes --all node-role.kubernetes.io/control-plane-
  when: single_node | bool
  changed_when: true
  failed_when: false
